name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - run: npm ci

      - name: Lint
        run: npx eslint "{src,apps,libs,test}/**/*.ts"

      - name: Type-check
        run: npx tsc --noEmit -p tsconfig.build.json

      - name: Unit tests
        run: npm test -- --ci

      - name: Build
        run: npm run build

  deploy:
    needs: build-and-test
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    steps:
      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::205930613434:role/github-actions-deploy-vira
          aws-region: ap-northeast-2

      - name: Deploy to EC2 via SSM
        run: |
          COMMAND_ID=$(aws ssm send-command \
            --instance-ids i-0111fe4bf98dae985 \
            --document-name "AWS-RunShellScript" \
            --parameters 'commands=[
              "set -e",
              "cd /opt/vira/app",
              "git fetch --depth 1 origin master",
              "git reset --hard origin/master",
              "npm ci --include=dev",
              "npm run build:api",
              "systemctl restart vira-api",
              "for i in $(seq 1 15); do sleep 2; curl -sf -o /dev/null http://localhost:3007 && echo HEALTHY && exit 0; done; echo NEVER BECAME HEALTHY; systemctl status vira-api --no-pager -l; exit 1"
            ]' \
            --comment "Deploy ${{ github.sha }}" \
            --query 'Command.CommandId' --output text)
          echo "Command ID: $COMMAND_ID"

          for i in $(seq 1 30); do
            STATUS=$(aws ssm get-command-invocation --command-id "$COMMAND_ID" --instance-id i-0111fe4bf98dae985 --query 'Status' --output text 2>/dev/null || echo "Pending")
            echo "Status: $STATUS"
            if [ "$STATUS" = "Success" ]; then exit 0; fi
            if [ "$STATUS" = "Failed" ] || [ "$STATUS" = "Cancelled" ] || [ "$STATUS" = "TimedOut" ]; then
              aws ssm get-command-invocation --command-id "$COMMAND_ID" --instance-id i-0111fe4bf98dae985
              exit 1
            fi
            sleep 10
          done
          echo "Timed out waiting for deploy command"
          exit 1
